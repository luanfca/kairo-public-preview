<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kairo — Market Monitor Preview</title>
<style>
  body { font: 16px system-ui, sans-serif; background: #eaf1f5; color: #152d3e; margin: 0; }
  main { max-width: 52rem; margin: 4rem auto; padding: 1.5rem; }
  table { width: 100%; background: white; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: .8rem; text-align: left; border-bottom: 1px solid #dce5eb; }
  button { margin: 1rem 0; padding: .65rem 1rem; background: #164e63; color: white; border: 0; border-radius: .4rem; cursor: pointer; }
  .quotes { overflow-x: auto; }
</style>
<main>
  <h1>Kairo Market Monitor</h1>
  <p>Compare buy and sell quotes across venues using simulated market data.</p>
  <label>Alert threshold (%) <input id="threshold" type="number" value="0.1" step="0.01"></label>
  <button id="update" type="button">Update sample</button>
  <div class="quotes">
    <table>
      <thead><tr><th>Pair</th><th>Buy ask</th><th>Sell bid</th><th>Gross spread</th><th>Recent spreads</th></tr></thead>
      <tbody id="quotes"></tbody>
    </table>
  </div>
  <p id="status" role="status"></p>
</main>
<script type="module">
  import { Monitor } from './monitor.mjs';
  const monitor = new Monitor();
  const pairs = [['BTC/USDT', 64120, 64181], ['ETH/USDT', 3180, 3178], ['SOL/USDT', 142.35, 142.61]];
  const offsets = [0, 0.001, -0.001, 0.002];
  let sample = 0;
  function render() {
    const rows = document.querySelector('#quotes');
    rows.replaceChildren();
    const now = Date.now();
    const books = pairs.flatMap(([pair, ask, bid], index) => {
      const sell = Number((bid * (1 + offsets[(sample + index) % offsets.length])).toFixed(2));
      return [
        { pair, venue: 'Venue A', ask, bid: ask - 0.01, receivedAt: now },
        { pair, venue: 'Venue B', ask: sell + 0.01, bid: sell, receivedAt: now },
      ];
    });
    const threshold = document.querySelector('#threshold').valueAsNumber;
    const opportunities = monitor.scan(books, now, Number.isFinite(threshold) ? threshold : Infinity);
    for (const {pair, buy, sell, spread, history} of opportunities) {
      const row = rows.insertRow();
      for (const value of [pair, `${buy.venue} · ${buy.ask.toFixed(2)}`, `${sell.venue} · ${sell.bid.toFixed(2)}`, `${spread.toFixed(2)}%`, history.slice(-5).map(point => `${point.spread.toFixed(2)}%`).join(' · ')]) {
        row.insertCell().textContent = value;
      }
    }
    const alerts = opportunities.filter(row => row.alert).map(row => row.pair);
    document.querySelector('#status').textContent = alerts.length ? `Threshold crossed: ${alerts.join(', ')}.` : `Synthetic sample ${sample + 1}.`;
  }
  document.querySelector('#update').addEventListener('click', () => { sample += 1; render(); });
  render();
</script>
</html>
